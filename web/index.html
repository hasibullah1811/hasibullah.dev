  <!--
    Theme before first paint: the visitor's stored choice (localStorage
    "theme", written by lib/platform/browser_web.dart), else the system
    setting. Sets <html data-theme> for the loader below and the theme-color
    meta, so nothing flashes the wrong theme while Flutter loads. Colours
    match AppColors.light/dark.paper in lib/theme.dart.
  -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#171412' : '#FFFFFF');
    })();
  </script>

  <!--

    Flutter's first frame. Keep it in sync with lib/content/portfolio_content.dart;
    test/content_test.dart checks the key facts.
  -->
  <!-- Preloaded so the loading state and Flutter (which fetches the same
       URLs from FontManifest.json) both get the fonts without a flash. -->
  <link rel="preload" href="assets/assets/fonts/Geist-400.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    @font-face { font-family: "Geist"; font-weight: 400; font-display: swap; src: url("assets/assets/fonts/Geist-400.ttf") format("truetype"); }
    @font-face { font-family: "Geist"; font-weight: 500; font-display: swap; src: url("assets/assets/fonts/Geist-500.ttf") format("truetype"); }
    @font-face { font-family: "Geist"; font-weight: 600; font-display: swap; src: url("assets/assets/fonts/Geist-600.ttf") format("truetype"); }
    @font-face { font-family: "Source Serif 4"; font-weight: 600; font-display: swap; src: url("assets/assets/fonts/SourceSerif4-600.ttf") format("truetype"); }
    @font-face { font-family: "Geist Mono"; font-weight: 500; font-display: swap; src: url("assets/assets/fonts/GeistMono-500.ttf") format("truetype"); }
    /* Light and dark tokens; keep in sync with AppColors in lib/theme.dart. */
    :root {
      --paper: #FFFFFF; --surface: #FFFFFF; --ink: #1B1916; --ink-soft: #45413A;
      --muted: #615B52; --line: #E8E6E1; --accent: #A63F25; --available: #277046;
    }
    :root[data-theme="dark"] {
      --paper: #171412; --surface: #201C19; --ink: #F3EEE7; --ink-soft: #D3CBC0;
      --muted: #ABA296; --line: #4A423B; --accent: #E8957A; --available: #7CC79A;
    }
    /* Without JavaScript there is no data-theme; follow the system. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --paper: #171412; --surface: #201C19; --ink: #F3EEE7; --ink-soft: #D3CBC0;
        --muted: #ABA296; --line: #4A423B; --accent: #E8957A; --available: #7CC79A;
      }
    }
    html, body { margin: 0; background: var(--paper); }
    body { overflow: hidden; }
    #loading {
      position: fixed; inset: 0; z-index: 10; overflow-y: auto;
      background: var(--paper); color: var(--ink-soft);
      font: 17px/1.5 "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .3s ease;
    }
    #loading .wrap { max-width: 696px; margin: 0 auto; padding: 124px 32px 48px; }
    #loading .status {
      display: inline-flex; align-items: center; gap: 11px; padding-left: 5px;
      font: 500 13px/1.4 "Geist Mono", ui-monospace, monospace; letter-spacing: .4px; color: var(--available);
    }
    #loading .status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--available); }
    #loading h1 { margin: 20px 0 8px; font: 600 46px/1.1 "Source Serif 4", Georgia, serif; letter-spacing: -.5px; color: var(--ink); }
    #loading .tagline { margin: 12px 0 28px; max-width: 620px; font-size: 20px; }
    #loading .links { display: flex; flex-wrap: wrap; gap: 10px; }
    #loading .links a {
      padding: 12px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
      color: var(--ink); font-weight: 600; font-size: 14px; text-decoration: none;
    }
    #loading .links a:first-child { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    #loading .links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #loading .progress { margin-top: 40px; height: 2px; width: 160px; background: var(--line); overflow: hidden; border-radius: 2px; }
    #loading .progress::after {
      content: ""; display: block; height: 100%; width: 40%; background: var(--accent);
      animation: slide 1.2s ease-in-out infinite;
    }
    #loading .progress-label { margin-top: 10px; font: 500 12px/1.4 "Geist Mono", ui-monospace, monospace; color: var(--muted); }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (max-width: 599px) {
      #loading .wrap { padding: 100px 20px 40px; }
      #loading h1 { font-size: 36px; }
      #loading .tagline { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading { transition: none; }
      #loading .progress::after { animation: none; width: 100%; opacity: .4; }
    }
