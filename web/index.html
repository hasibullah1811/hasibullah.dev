  <style>
    /* THE CSS FOR YOUR LOADER */
    body { background-color: #050505; margin: 0; padding: 0; overflow: hidden; }
    .loading-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; background-color: #050505;
      font-family: 'Courier New', Courier, monospace;
    }
    .terminal-text { color: #4ADE80; font-size: 16px; margin-bottom: 20px; letter-spacing: 2px; }
    .cursor {
      display: inline-block; width: 10px; height: 18px; background-color: #4ADE80;
      animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 5px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .progress-bar { width: 200px; height: 2px; background-color: #1a1a1a; position: relative; overflow: hidden; }
    .progress-fill {
      position: absolute; top: 0; left: 0; height: 100%; width: 0%; background-color: #4ADE80;
      animation: load 2.5s ease-in-out forwards;
    }
    @keyframes load { 0% { width: 0%; } 50% { width: 60%; } 100% { width: 100%; } }
  </style>
</head>
<body>
  <div id="loader" class="loading-container">
    <div class="terminal-text">
      > SYSTEM_INITIALIZING<span class="cursor"></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

</body>
