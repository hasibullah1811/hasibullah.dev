name: hasib_website
description: "Portfolio of Hasibullah Hasib, Software Developer."

publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.9.2
  # Pinned. CI and scripts/vercel-install.sh read this exact version.
  flutter: 3.47.4

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Latin subsets of Inter, Source Serif 4 and JetBrains Mono (SIL OFL 1.1),
  # bundled so the site makes no runtime requests to Google Fonts.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-600.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
