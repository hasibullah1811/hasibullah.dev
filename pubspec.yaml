name: hasib_website
description: "Portfolio of Hasibullah Hasib, Software Developer."

publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.9.2
  # Pinned. CI and scripts/vercel-install.sh read this exact version.
  flutter: 3.47.4

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.3
  # Already a dependency of url_launcher_web. Used directly for the stored
  # theme choice (localStorage) and the page's theme-color meta tag.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Latin subsets of Geist, Geist Mono (assets/fonts/OFL-Geist.txt) and
  # Source Serif 4 (SIL OFL 1.1), bundled so the site makes no runtime
  # requests to Google Fonts. web/index.html preloads the same files.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-400.ttf
          weight: 400
        - asset: assets/fonts/Geist-500.ttf
          weight: 500
        - asset: assets/fonts/Geist-600.ttf
          weight: 600
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-600.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-400.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-500.ttf
          weight: 500
